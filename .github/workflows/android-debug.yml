name: Build offline Android prototype
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate no INTERNET permission
        run: |
          if grep -R 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'Unexpected INTERNET permission in manifest'
            exit 1
          fi
      - name: Upload installable prototype
        uses: actions/upload-artifact@v4
        with:
          name: BraveFrontierOffline-prototype-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Verify embedded Android server host
on:
  push:
    branches: [main, feature/embedded-server-bootstrap]
    paths:
      - '.github/workflows/android-host.yml'
      - 'android-host/**'
      - 'tools/**'
      - 'upstream.lock.json'
  workflow_dispatch:
jobs:
  android-host:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check Python builder syntax
        run: python3 -m compileall -q tools
      - name: Test one-APK integration helpers
        run: python3 -m unittest discover -s tools/tests -v
      - name: Compile bridge Android AAR (no native server yet)
        run: cd android-host && gradle --no-daemon :host:assembleRelease
      - name: Publish bridge AAR as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-host-library
          path: android-host/host/build/outputs/aar/host-release.aar
          if-no-files-found: error

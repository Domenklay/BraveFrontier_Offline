name: Build existing C++ Brave Frontier server for Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-native-build.yml'
      - 'tools/build_android_native.py'
      - 'android-host/native/**'
      - 'upstream.lock.json'

jobs:
  native-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      VCPKG_DISABLE_METRICS: 1
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android NDK 27
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Install CMake 4 and Ninja
        run: |
          python3 -m pip install --user cmake==4.1.2 ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache source dependencies and cross-built libraries
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-binary-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: bf-android-ndk27-vcpkg-${{ hashFiles('upstream.lock.json') }}-v1
          restore-keys: |
            bf-android-ndk27-vcpkg-
      - name: Prepare vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Checkout upstream C++ game server at pinned commit
        run: python3 tools/sync_upstream.py
      - name: Compile real upstream C++ server shared library for Android
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: python3 tools/build_android_native.py
      - name: Verify output is Android aarch64 ELF library
        run: |
          SO=android-host/host/src/main/jniLibs/arm64-v8a/libbf_offline_server.so
          test -s "$SO"
          file "$SO"
          readelf -h "$SO" | grep -E 'ELF64|AArch64|DYN'
          sha256sum "$SO"
      - name: Store C++ server library (not an original game APK)
        uses: actions/upload-artifact@v4
        with:
          name: bf-original-server-android-arm64
          path: android-host/host/src/main/jniLibs/arm64-v8a/libbf_offline_server.so
          if-no-files-found: error
